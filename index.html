<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GOGOいもっち！</title>
<meta name="description" content="横浜から群馬・太田まで、車を踏んでジャンプで進むドット絵の横スクロールゲーム。帰り道は夜明けまでのタイムアタック。">
<meta property="og:title" content="GOGOいもっち！">
<meta property="og:description" content="横浜から太田へ！車を踏んで進むドット絵ゲーム。みんなのランキングつき。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0d1020">
<style>
  :root{ --bg:#0d1020; --fg:#f4f4f8; --btn:rgba(255,255,255,.14); --btnOn:rgba(255,255,255,.32); color-scheme:dark; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;image-rendering:pixelated}
  #snd,#rankBtn,#pauseBtn{position:fixed;top:calc(3px + env(safe-area-inset-top,0px));width:30px;height:26px;padding:0;border-radius:13px;
    background:var(--btn);border:1px solid rgba(255,255,255,.35);color:#fff;font:bold 15px/24px sans-serif;text-align:center;cursor:pointer;z-index:5;transform-origin:center}
  #snd{right:calc(4px + env(safe-area-inset-right,0px))}
  #snd.off{opacity:.45;text-decoration:line-through}
  #snd:focus-visible{outline:2px solid #ffe14d}
  #notice{position:fixed;inset:0;background:#000;color:#f4f4f8;display:flex;align-items:center;justify-content:center;z-index:50;transition:opacity .35s}
  #notice p{margin:0;padding:0 16px;font-size:15px;line-height:1.9;text-align:center;font-weight:bold}
  #notice.hide{opacity:0;pointer-events:none}
  body.rotated #notice p{transform:rotate(90deg);width:calc(100vh - 40px);flex:none;box-sizing:border-box}
  #pauseBtn,#rankBtn{right:calc(38px + env(safe-area-inset-right,0px))}
  body.rotated #pauseBtn,body.rotated #rankBtn{top:auto;bottom:calc(38px + env(safe-area-inset-bottom,0px));right:calc(3px + env(safe-area-inset-right,0px));transform:rotate(90deg)}
  #rank{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;
    background:rgba(13,16,32,.96);border:2px solid #ffd27a;border-radius:12px;padding:12px 14px;z-index:10;touch-action:auto;-webkit-user-select:text;user-select:text;box-sizing:border-box}
  #rank[hidden]{display:none}
  .rk-head{display:flex;justify-content:space-between;align-items:center;font-size:16px;color:#ffd27a}
  .rk-head button{background:none;border:0;color:#fff;font-size:18px;cursor:pointer;padding:2px 6px}
  .rk-name{display:flex;gap:6px;align-items:center;margin:8px 0;font-size:12px;flex-wrap:wrap}
  .rk-name input{flex:1;min-width:120px;padding:5px 8px;border-radius:6px;border:1px solid #556;background:#1a1f38;color:#fff;font-size:14px}
  .rk-name button{padding:5px 12px;border-radius:6px;border:0;background:#1f6fd6;color:#fff;font-weight:bold;cursor:pointer}
  .rk-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .rk-cols h3{margin:4px 0;font-size:13px;color:#9fd0ff}
  .rk-cols ol{margin:0;padding-left:22px;font-size:13px;line-height:1.7}
  .rk-cols li span{float:right;color:#ffe14d;font-variant-numeric:tabular-nums}
  .rk-cols li.me{color:#7dff8a}
  #rkStatus{margin:8px 0 0;font-size:11px;color:#cfd3e6}
  @media (max-width:420px){body:not(.rotated) .rk-cols{grid-template-columns:1fr}}
  body.rotated #rank{transform:translate(-50%,-50%) rotate(90deg);width:min(560px,calc(100vh - 32px));max-height:calc(100vw - 32px)}
  /* 縦持ちのスマホでは画面ごと90度回して横画面で表示する */
  body.rotated #snd{top:auto;bottom:calc(4px + env(safe-area-inset-bottom,0px));right:calc(3px + env(safe-area-inset-right,0px));transform:rotate(90deg)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="notice"><p>このゲームはフィクションです。<br>登場する人物などは、実在の人物には一切関係ありません。</p></div>
<button id="snd" type="button" aria-label="音のON/OFF（M）" title="音のON/OFF（M）">♪</button>
<button id="pauseBtn" type="button" hidden aria-label="一時停止（P）" title="一時停止（P）">⏸</button>
<button id="rankBtn" type="button" aria-label="ランキング" title="ランキング">🏆</button>
<div id="rank" hidden>
  <div class="rk-head"><b>🏆 みんなのランキング</b><button id="rkClose" type="button" aria-label="閉じる">✕</button></div>
  <div class="rk-name"><label for="rkName">なまえ</label><input id="rkName" maxlength="12" placeholder="ランキングに出す名前"><button id="rkSave" type="button">保存</button></div>
  <div class="rk-cols">
    <div><h3>行き：スコア</h3><ol id="rkScore"></ol></div>
    <div><h3>帰り道：タイム</h3><ol id="rkTime"></ol></div>
  </div>
  <p id="rkStatus"></p>
</div>
<script>
(()=>{
const W=480,H=270,GROUND=225,BG=1.5; // 背景は旧320x180の座標を1.5倍で描く
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const isTouch=()=>matchMedia('(pointer:coarse)').matches||('ontouchstart' in window)||navigator.maxTouchPoints>0;
function resize(){
  // 縦持ちのスマホでは、キャンバスを90度回して横画面として使う
  const rot=isTouch()&&innerHeight>innerWidth;
  document.body.classList.toggle('rotated',rot);
  const dpr=window.devicePixelRatio||1, vw=rot?innerHeight:innerWidth, vh=rot?innerWidth:innerHeight;
  const scale=Math.min(vw/W,vh/H);
  cv.style.transform=rot?'rotate(90deg)':'';
  cv.style.width=Math.floor(W*scale)+'px'; cv.style.height=Math.floor(H*scale)+'px';
  cv.width=Math.floor(W*scale*dpr); cv.height=Math.floor(H*scale*dpr);
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0); ctx.imageSmoothingEnabled=false;
}
addEventListener('resize',resize); resize();

// ---------- 共通：多角形で描いて → ドット化（色を限定・縁取り） ----------
const OUTLINE='#15111c';
function hex2rgb(h){const n=parseInt(h.slice(1),16);return [n>>16,(n>>8)&255,n&255];}
function shade(hex,amt){
  let [r,g,b]=hex2rgb(hex);
  r=Math.max(0,Math.min(255,r+amt));g=Math.max(0,Math.min(255,g+amt));b=Math.max(0,Math.min(255,b+amt));
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
function pixelize(c,pal,outline=true){
  const g=c.getContext('2d'),w=c.width,h=c.height;
  const id=g.getImageData(0,0,w,h),d=id.data;
  const P=[...pal].map(hex2rgb);
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]<120){d[i+3]=0;continue;}
    let best=0,bd=1e9;
    for(let k=0;k<P.length;k++){const dr=d[i]-P[k][0],dg=d[i+1]-P[k][1],db=d[i+2]-P[k][2];const dd=dr*dr+dg*dg+db*db;if(dd<bd){bd=dd;best=k;}}
    d[i]=P[best][0];d[i+1]=P[best][1];d[i+2]=P[best][2];d[i+3]=255;
  }
  if(outline){
    const src=new Uint8ClampedArray(d);const o=hex2rgb(OUTLINE);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const i=(y*w+x)*4;if(src[i+3])continue;
      const n=(xx,yy)=>xx>=0&&yy>=0&&xx<w&&yy<h&&src[(yy*w+xx)*4+3];
      if(n(x-1,y)||n(x+1,y)||n(x,y-1)||n(x,y+1)){d[i]=o[0];d[i+1]=o[1];d[i+2]=o[2];d[i+3]=255;}
    }
  }
  g.putImageData(id,0,0);
}
const pts=s=>s.trim().split(/\s+/).map(p=>p.split(',').map(Number));
function path(g,P){g.beginPath();P.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();}

// ---------- いもっち（写真から：黒髪・メガネ・青ポロ＋黒パネル＋赤ライン・タオル・グレーのズボン・白スニーカー・お腹） ----------
const CW=46,CH=54,FOOT=50;
const C={skin:'#c68a5c',skinD:'#a06a44',hair:'#16120f',hairL:'#3a302a',frame:'#1c1c22',lens:'#bcd3de',
  blue:'#1f44e6',blueD:'#1630a8',blueL:'#4d6dff',black:'#1b1b22',red:'#e2203e',white:'#f4f4f4',
  towel:'#a39a8e',towelL:'#c9c1b5',pants:'#80858f',pantsD:'#62666f',shoe:'#ececec',shoeD:'#a9a9ad',mouth:'#4a1f19',
  bottle:'#dcefff',label:'#2a5bd7'};
function renderChar(pose){
  const c=document.createElement('canvas');c.width=CW;c.height=CH;const g=c.getContext('2d');
  const pal=new Set([OUTLINE]);const F=col=>{pal.add(col);g.fillStyle=col;};const S=col=>{pal.add(col);g.strokeStyle=col;};
  g.lineCap='round';g.lineJoin='round';
  const hip=[21,31];
  function leg(ang,bend,pc){
    const k=[hip[0]+7.5*Math.sin(ang),hip[1]+7.5*Math.cos(ang)];
    const a2=ang-bend;const a=[k[0]+8*Math.sin(a2),k[1]+8*Math.cos(a2)];
    S(pc);g.lineWidth=5.5;g.beginPath();g.moveTo(hip[0],hip[1]);g.lineTo(k[0],k[1]);g.lineTo(a[0],a[1]);g.stroke();
    // スニーカー（白・黒ライン）
    const sx=Math.round(a[0]),sy=Math.round(a[1]);
    F(C.shoe);g.beginPath();g.moveTo(sx-3,sy-1);g.lineTo(sx+4,sy-1);g.quadraticCurveTo(sx+8,sy,sx+8,sy+3);g.lineTo(sx-3,sy+3);g.closePath();g.fill();
    F(C.shoeD);g.fillRect(sx-3,sy+2,11,1);
    F(C.black);g.fillRect(sx+1,sy,2,1);
  }
  function arm(ang,sleeve,skin,bottle){
    const sh=[21,20];
    const e=[sh[0]+6*Math.sin(ang),sh[1]+6*Math.cos(ang)];
    const a2=ang+0.35;const hnd=[e[0]+6*Math.sin(a2),e[1]+6*Math.cos(a2)];
    const se=[sh[0]+4*Math.sin(ang),sh[1]+4*Math.cos(ang)];
    S(skin);g.lineWidth=3.6;g.beginPath();g.moveTo(se[0],se[1]);g.lineTo(e[0],e[1]);g.lineTo(hnd[0],hnd[1]);g.stroke();
    F(skin);g.beginPath();g.arc(hnd[0],hnd[1],2,0,7);g.fill();
    S(sleeve);g.lineWidth=5.4;g.beginPath();g.moveTo(sh[0],sh[1]);g.lineTo(se[0],se[1]);g.stroke();
    if(bottle){const bx=Math.round(hnd[0])-1,by=Math.round(hnd[1]);F(C.bottle);g.fillRect(bx,by-1,3,8);F(C.label);g.fillRect(bx,by+1,3,2);F(C.white);g.fillRect(bx+1,by-2,1,1);}
  }
  // 奥の腕・奥の脚
  arm(pose.ba,C.blueD,C.skinD,false);
  leg(pose.bl,pose.bb,C.pantsD);
  leg(pose.fl,pose.fb,C.pants);
  // 腰
  F(C.pants);path(g,pts('14,31 27,31 27,37 15,37'));g.fill();
  // ポロシャツ（お腹が前に出る）
  g.beginPath();g.moveTo(14,18);g.lineTo(25,17.5);g.bezierCurveTo(32.5,19.5,35.5,29,28.5,34.8);g.lineTo(14,34.8);g.bezierCurveTo(11.4,29,11.4,22,14,18);g.closePath();
  F(C.blue);g.fill();
  g.save();g.clip();
  F(C.blueL);g.fillRect(25,21,7,1);              // お腹のハイライト
  F(C.blueD);g.fillRect(10,18,3,18);g.fillRect(10,33,30,3);
  F(C.black);g.fillRect(15,23,3,12);              // 脇の黒パネル
  F(C.red);g.fillRect(18,23,1,12);                // 赤ライン
  g.restore();
  F(C.white);g.fillRect(25,21,3,1);F(C.white);g.fillRect(26,20,1,1); // 胸のロゴ
  F(C.red);g.fillRect(23,17,3,1);                 // 襟の赤
  // 首のタオル
  F(C.towel);g.beginPath();g.ellipse(20,17.6,6.6,2.4,0,0,7);g.fill();
  F(C.towelL);g.fillRect(16,16,7,1);
  // 頭
  F(C.skin);g.beginPath();g.arc(21.5,10,6.8,0,7);g.fill();
  F(C.skin);g.fillRect(24,13,4,3); // あご
  F(C.skinD);g.fillRect(17,10,2,3);   // 耳
  // 黒髪（ボサっと）
  F(C.hair);g.beginPath();g.moveTo(14,12.5);g.lineTo(14,6);g.quadraticCurveTo(20,1.2,28,4);g.lineTo(29,7.5);g.lineTo(25.5,6.5);g.lineTo(22,8);g.lineTo(19,7.2);g.lineTo(17.5,9);g.lineTo(16.5,13);g.closePath();g.fill();
  F(C.hair);g.fillRect(16,2,2,2);g.fillRect(20,1,2,2);g.fillRect(24,2,2,1);g.fillRect(27,3,2,2);
  F(C.hairL);g.fillRect(19,3,3,1);
  // メガネ
  F(C.frame);g.fillRect(17,9,6,1);g.fillRect(22,9,7,1);g.fillRect(22,12,6,1);g.fillRect(22,9,1,4);g.fillRect(28,9,1,3);
  F(C.lens);g.fillRect(23,10,5,2);
  F(C.frame);g.fillRect(25,10,1,2); // 目
  F(C.skinD);g.fillRect(28,12,1,2); // 鼻
  F(C.mouth);g.fillRect(25,15,pose.hurt?3:2,pose.hurt?2:1);
  // 手前の腕（ペットボトル）
  arm(pose.fa,C.blue,C.skin);
  pixelize(c,pal);
  return c;
}
const CHAR={run:[]};
for(let k=0;k<8;k++){
  const s=Math.sin(k/8*Math.PI*2);
  CHAR.run.push(renderChar({fl:0.7*s,bl:-0.7*s,fb:s<0?-s*1.3+0.1:0.1,bb:s>0?s*1.3+0.1:0.1,fa:-0.75*s,ba:0.75*s}));
}
CHAR.idle=renderChar({fl:0.06,bl:-0.06,fb:0.1,bb:0.1,fa:0.15,ba:-0.15});
CHAR.jump=renderChar({fl:0.95,bl:-0.45,fb:1.5,bb:0.7,fa:2.2,ba:-0.7});
CHAR.hurt=renderChar({fl:0.5,bl:-0.6,fb:0.6,bb:0.4,fa:2.7,ba:-2.6,hurt:true});

// さつまいも（回復）
function renderImo(){
  // 紡錘形の赤紫の皮・左の切り口は黄色い中身・右はしっぽのひげ根・皮の筋と芽の点
  // 割った焼き芋：2つに割った半分ずつが、黄金色の中身を向かい合わせにしている（湯気は描画側で）
  const c=document.createElement('canvas');c.width=32;c.height=17;const g=c.getContext('2d');const pal=new Set([OUTLINE]);
  const F=col=>{pal.add(col);g.fillStyle=col;};const R=(x,y,w,h)=>g.fillRect(x,y,w,h);
  const half=(m)=>{ // m=1:左の半分（中身は右向き） m=-1:右の半分。割れ目側を少し持ち上げてハの字に
    g.save();if(m<0){g.translate(32,0);g.scale(-1,1);}
    g.translate(1,12);g.rotate(-0.26);g.translate(-1,-12);
    F('#8a2c58');g.beginPath();g.moveTo(1,10);g.quadraticCurveTo(3,5,11,4.5);g.lineTo(11,14.5);g.quadraticCurveTo(3,14.5,1,11.5);g.closePath();g.fill(); // 焼けた皮
    F('#5e1d3c');R(3,12.5,8,2);                                               // 下の陰
    F('#c25a8e');R(4,6,6,1.2);                                                // てかり
    F('#2e1220');R(6,9,1.2,1.2);R(9,11,1.2,1.2);R(3.5,10.5,1.2,1.2);          // 焦げ
    F('#f5b52e');g.beginPath();g.ellipse(11,9.5,3,5,0,0,7);g.fill();          // 割れた中身（黄金色）
    F('#ffd95a');g.beginPath();g.ellipse(11.6,9.2,2,3.8,0,0,7);g.fill();
    F('#fff0a8');R(11,6.5,1.2,2);R(12.2,10,1.2,1.2);                          // ほくほくの光
    F('#d98a1c');R(10.5,12.6,1.2,1.2);
    g.restore();
  };
  half(1);half(-1);
  pixelize(c,pal);return c;
}
const IMO=renderImo();
// 焼きまんじゅう（群馬名物：竹串に4つ・みそだれの焦げ目）
function renderManju(){
  const c=document.createElement('canvas');c.width=28;c.height=13;const g=c.getContext('2d');const pal=new Set([OUTLINE]);
  const F=col=>{pal.add(col);g.fillStyle=col;};
  F('#d9b77a');g.fillRect(0,6,28,1.6);                                    // 竹串
  for(let i=0;i<4;i++){const x=4.5+i*6.2;
    F('#b8682a');g.beginPath();g.arc(x,6.5,3.6,0,7);g.fill();             // まんじゅう（みそだれ）
    F('#e39a4e');g.fillRect(x-2,3.6,2.5,1.2);                               // てかり
    F('#6a3214');g.fillRect(x+0.6,7.4,1.6,1.2);g.fillRect(x-2.4,8.6,1.2,1); // 焦げ目
  }
  pixelize(c,pal);return c;
}
const MANJU=renderManju();
// メカヘルメット（オリジナルデザイン：緑のまるいヘルメット＋丸窓の一つ目カメラ＋★アンテナ）
function renderHelmet(eyeOn=true){
  const c=document.createElement('canvas');c.width=28;c.height=26;const g=c.getContext('2d');const pal=new Set([OUTLINE]);
  const F=col=>{pal.add(col);g.fillStyle=col;};
  g.translate(2,4);
  F('#4f8a3c');g.beginPath();g.ellipse(12,10,9.6,8.8,0,0,7);g.fill();             // ドーム（緑）
  F('#3a6a2c');g.beginPath();g.moveTo(3,12);g.lineTo(21,12);g.lineTo(19,19);g.lineTo(6,19);g.closePath();g.fill(); // あご
  F('#7fbf5c');g.fillRect(6,3,7,1);g.fillRect(4,5,2,3);                             // ハイライト
  F('#f4f4f4');g.fillRect(3,9,8,1.5);                                               // 白ライン
  F('#1a1a20');g.beginPath();g.arc(16.5,9.5,4.6,0,7);g.fill();                       // 丸窓
  F('#9aa3ad');g.beginPath();g.arc(16.5,9.5,4.6,0,7);g.lineWidth=1;pal.add('#9aa3ad');g.strokeStyle='#9aa3ad';g.stroke();
  if(eyeOn){F('#3fe6ff');g.beginPath();g.arc(17.5,9.5,2.2,0,7);g.fill();F('#e8ffff');g.fillRect(17,8,1,1);} // 一つ目（水色）
  else{F('#2c5a66');g.beginPath();g.arc(17.5,9.5,2.2,0,7);g.fill();}
  F('#16161c');g.fillRect(4,13,5,4);F('#8a96a0');g.fillRect(5,14,3,1);g.fillRect(5,16,3,1); // ほほの排気口
  F('#2a2a32');g.fillRect(5,19,14,2);                                                // 首のリング
  pixelize(c,pal);return c;
}
const HELMET=renderHelmet(true), HELMET_OFF=renderHelmet(false);
const MECHA_TIME=600; // 10秒（60fps）
// 編集長（オリジナルキャラ）：白髪オールバック・太いひげ・紺のスーツ・赤ネクタイ・腕組み。左向き
function renderEditor(){
  const c=document.createElement('canvas');c.width=44;c.height=60;const g=c.getContext('2d');const pal=new Set([OUTLINE]);
  const F=col=>{pal.add(col);g.fillStyle=col;};
  // 脚と靴
  F('#3a3d48');g.fillRect(15,40,6,15);g.fillRect(23,40,6,15);
  F('#1a1a1e');g.fillRect(11,54,10,4);g.fillRect(21,54,10,4);
  // 胴体（紺のスーツ）
  F('#23305a');g.beginPath();g.moveTo(12,19);g.lineTo(32,19);g.lineTo(33,42);g.lineTo(11,42);g.closePath();g.fill();
  F('#f4f4f4');path(g,pts('19,19 25,19 22,27'));g.fill();                       // シャツ
  F('#d8202c');path(g,pts('21,20 23,20 23.5,30 22,32 20.5,30'));g.fill();       // ネクタイ
  F('#1a2446');g.fillRect(11,40,22,2);

const PAD=3, CS=2; // 車は2倍の解像度で描いて半分の大きさで表示する（細部まで出る）
function chaikin(P,n){for(let k=0;k<n;k++){const Q=[];for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];
  Q.push([a[0]*0.75+b[0]*0.25,a[1]*0.75+b[1]*0.25],[a[0]*0.25+b[0]*0.75,a[1]*0.25+b[1]*0.75]);}P=Q;}return P;}

function renderCar(m,color,frame){

    g.save();path(g,gp);g.clip();

    F('#7fa6c8');path(g,[[gx0+12,gy1],[gx0+13.5,gy1],[gx0+21.5,gy0],[gx0+20,gy0]]);g.fill();

    const cl=col(cc);F(cl);

    if(cl==='#e8f4ff'){const [a,b2,c2,d2]=bbox(P);F('#ffffff');g.beginPath();g.arc(a+(c2-a)*0.65,b2+(d2-b2)*0.5,Math.min(1.2,(d2-b2)*0.35),0,7);g.fill();

    if(cl==='#d8202c'){const [a,b2,c2,d2]=bbox(P);F('#ff7070');g.fillRect(a+0.6,b2+(d2-b2)*0.3,(c2-a)-1.2,0.8);}

    F('#0a0a0c');for(let i=0;i<14;i++){const a=a0*0.8+i*Math.PI/7;g.fillRect(x+Math.cos(a)*(r-0.5)-0.4,cy+Math.sin(a)*(r-0.5)-0.4,0.8,0.8);}

      F('#7a7d84');g.beginPath();g.arc(x,cy,r-3.6,0,7);g.fill();                          // ディスク
      if(cal){F(cal);g.beginPath();g.arc(x,cy,r-3.4,-2.5,-1.5);g.arc(x,cy,r-5.4,-1.5,-2.5,true);g.closePath();g.fill();}
      const n=m.rim==='gold'?10:5;

        S(rc);g.lineWidth=n===10?0.9:1.6;g.beginPath();g.moveTo(x,cy);g.lineTo(x+Math.cos(a)*(r-2.5),cy+Math.sin(a)*(r-2.5));g.stroke();
        S(rd);g.lineWidth=0.4;g.beginPath();g.moveTo(x+Math.cos(a+0.25)*1.8,cy+Math.sin(a+0.25)*1.8);g.lineTo(x+Math.cos(a+0.12)*(r-2.7),cy+Math.sin(a+0.12)*(r-2.7));g.stroke();}

    }else{ // 鉄ちん＋キャップ
      F(rc);g.beginPath();g.arc(x,cy,r-2.6,0,7);g.fill();F(rd);for(let s=0;s<4;s++){const a=a0+s*Math.PI/2;g.beginPath();g.arc(x+Math.cos(a)*(r-4.2),cy+Math.sin(a)*(r-4.2),0.8,0,7);g.fill();}

}
function heightMap(c){ // 2倍で描いた絵から、ゲーム座標（1倍）での列ごとの上面を出す
  const g=c.getContext('2d'),d=g.getImageData(0,0,c.width,c.height).data,top=[];
  for(let xw=0;xw<c.width/CS;xw++){let t=Infinity;
    for(let sx=xw*CS;sx<xw*CS+CS;sx++)for(let y=0;y<c.height;y++){if(d[(y*c.width+sx)*4+3]){t=Math.min(t,y);break;}}
    top[xw]=t===Infinity?Infinity:Math.floor(t/CS);}
  return top;
}

let AC=null,OUT=null,SFX=null,MUS=null;

function audio(){
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    OUT=AC.createGain();OUT.gain.value=MUTED?0:1;OUT.connect(AC.destination);
    SFX=AC.createGain();SFX.gain.value=0.9;SFX.connect(OUT);
    MUS=AC.createGain();MUS.gain.value=0.45;MUS.connect(OUT);
  }
  if(AC.state==='suspended')AC.resume();

}
function setMute(m){MUTED=m;try{localStorage.setItem('gogoimo_mute',m?'1':'0');}catch(e){}if(OUT)OUT.gain.value=m?0:1;}
let NOISE=null;
function noiseBuf(){if(!NOISE){const n=AC.sampleRate*0.5;NOISE=AC.createBuffer(1,n,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}return NOISE;}
function tone(f1,f2,dur,wave,vol,delay=0,dest){
  const t=AC.currentTime+delay;
  const o=AC.createOscillator(),g=AC.createGain();o.type=wave;
  o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(dest||SFX);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,vol,delay=0,hp=1000,dest){
  const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf();f.type='highpass';f.frequency.value=hp;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(dest||SFX);s.start(t);s.stop(t+dur+0.02);
}

const mtof=m=>440*Math.pow(2,(m-69)/12);
function bgmNote(f,t,dur,wave,vol){
  const o=AC.createOscillator(),g=AC.createGain();o.type=wave;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.005);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(MUS);o.start(t);o.stop(t+dur+0.02);
}
function bgmDrum(kind,t){
  if(kind==='k'){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);
    g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.14);o.connect(g);g.connect(MUS);o.start(t);o.stop(t+0.16);}
  else{const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf();f.type='highpass';f.frequency.value=kind==='s'?1500:7000;
    const d=kind==='s'?0.12:0.03;g.gain.setValueAtTime(kind==='s'?0.25:0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);s.connect(f);f.connect(g);g.connect(MUS);s.start(t);s.stop(t+d+0.02);}
}
function bgmTick(){
  if(!BGM.on)return;
  while(BGM.next<AC.currentTime+0.12){
    const S=(G.p&&G.p.mecha>0)?MECHA_SONG:SONGS[BGM.song];
    const st=60/S.tempo/4, i=BGM.step%16, bar=((BGM.step/16)|0)%4, t=BGM.next;
    const n=S.lead[bar][i];
    if(n>=0)bgmNote(mtof(S.root+12+n),t,st*1.8,'square',0.07);
    if(n>=0&&S!==MECHA_SONG)bgmNote(mtof(S.root+24+n),t+st*0.5,st*0.9,'triangle',0.025); // こだま
    if(i%2===0){const b=S.bass[bar]+(i%4===2?12:0);bgmNote(mtof(S.root-12+b),t,st*1.6,'triangle',0.16);}
    if(i===0||i===8)bgmDrum('k',t);
    if(i===4||i===12)bgmDrum('s',t);
    if(i%2===1)bgmDrum('h',t);
    BGM.next+=st;BGM.step++;
  }
}
function bgmStart(song){
  try{audio();}catch(e){return;}
  BGM.song=song||0;
  if(!BGM.on){BGM.on=true;BGM.step=0;BGM.next=AC.currentTime+0.05;BGM.timer=setInterval(bgmTick,25);}
}
function bgmSet(song){ // 小節の頭で切り替わるよう、ステップを小節の頭にそろえる
  if(BGM.song===song)return;BGM.song=song;BGM.step=Math.ceil(BGM.step/16)*16;
}
function bgmStop(){BGM.on=false;if(BGM.timer){clearInterval(BGM.timer);BGM.timer=null;}}

// ---------- みんなのランキング（Web公開版：Googleのスプレッドシートに保存） ----------
// だれでも登録できる。1人1件（この端末に作ったidで区別）。行きのスコア・帰り道のタイムとも上位10件だけ残る
const RANK_API='https://script.google.com/macros/s/AKfycbz15xooJB_hZRQkrO8hTfL2gzp5PT0jH1MWWTKGpz7ImLPIlTaG514vDbaBdiy7SMy_Rg/exec';
const RANK={rows:{score:[],time:[]},ok:false,status:'',uid:'',tokGo:'',tokRet:'',my:{score:0,time:0}};
let rankName='';try{rankName=localStorage.getItem('gogoimo_name')||'';}catch(e){}
try{RANK.uid=localStorage.getItem('gogoimo_uid')||'';}catch(e){}
if(!/^[a-z0-9]{16,40}$/.test(RANK.uid)){RANK.uid=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(36).padStart(2,'0')).join('').slice(0,24);try{localStorage.setItem('gogoimo_uid',RANK.uid);}catch(e){}}
const rankBtn=document.getElementById('rankBtn'),rankEl=document.getElementById('rank'),rkName=document.getElementById('rkName');
rkName.value=rankName;
const RANK_MAX=10;
function topList(kind){return RANK.rows[kind]||[];}
function renderRank(){
  if(rankEl.hidden)return;
  for(const [kind,id] of [['score','rkScore'],['time','rkTime']]){
    const ol=document.getElementById(id);ol.textContent='';
    const rs=topList(kind).slice(0,RANK_MAX);
    if(!rs.length){const li=document.createElement('li');li.textContent=RANK.ok?'まだ記録なし':'読み込み中…';li.style.listStyle='none';ol.appendChild(li);}
    for(const r of rs){const li=document.createElement('li');if(r.me)li.className='me';
      li.textContent=String(r.n||'名無しのいもっち').slice(0,12);const sp=document.createElement('span');
      sp.textContent=kind==='score'?String(r.v):fmtTime(r.v);li.appendChild(sp);ol.appendChild(li);}
  }
  let st=RANK.status;
  if(!st&&RANK.ok)st='自分のベストを更新して10位以内に入ると自動で登録されます（11位以下になった記録は消えます）';
  document.getElementById('rkStatus').textContent=st;
}
function rankLine(kind,val){ // クリア・ゲームオーバー画面の「みんなの中で◯位」
  if(!RANK.ok||!(val>0))return '';
  const rs=topList(kind).filter(r=>!r.me);
  const pos=1+rs.filter(r=>kind==='score'?r.v>val:r.v<val).length;
  return pos<=RANK_MAX?`みんなのランキング ${pos}位！`:'みんなのランキング 10位圏外';
}
function apply(res){
  if(!res||!res.ok)return false;
  RANK.rows={score:res.score||[],time:res.time||[]};RANK.ok=true;
  const ms=RANK.rows.score.find(r=>r.me),mt=RANK.rows.time.find(r=>r.me);
  if(ms)RANK.my.score=Math.max(RANK.my.score,ms.v);if(mt)RANK.my.time=RANK.my.time>0?Math.min(RANK.my.time,mt.v):mt.v;
  renderRank();return true;
}
async function api(body){ // text/plain で送ると、ブラウザの事前確認なしでGoogleに届く
  const r=await fetch(RANK_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({u:RANK.uid},body))});
  return r.json();
}
async function loadRank(){
  try{const r=await fetch(RANK_API+'?u='+encodeURIComponent(RANK.uid));if(!apply(await r.json()))throw 0;
    if(RANK.status==='ランキングを読み込めませんでした')RANK.status='';}
  catch(e){RANK.status='ランキングを読み込めませんでした';}
  renderRank();
}
// ゲーム開始のたびに「札」をもらう（これがないと登録できない＝ズル対策）
function rankStart(ret){
  api({a:'start'}).then(res=>{if(res&&res.ok){if(ret)RANK.tokRet=res.t;else{RANK.tokGo=res.t;RANK.tokRet='';}}}).catch(()=>{});
}
function rankPos(kind,val){const rs=topList(kind).filter(r=>!r.me);return 1+rs.filter(r=>kind==='score'?r.v>=val:r.v<=val).length;}
function submitRank(kind,val){
  val=Math.round(val);if(!(val>0))return;
  const better=kind==='score'?val>RANK.my.score:!(RANK.my.time>0)||val<RANK.my.time;
  if(!better)return;
  if(RANK.ok&&rankPos(kind,val)>RANK_MAX)return;                 // 10位に入らない記録は送らない
  const t=kind==='time'?RANK.tokRet:RANK.tokGo;if(!t)return;
  api({a:'submit',k:kind,v:val,t,n:rankName}).then(res=>{
    if(apply(res)){if(res.saved){RANK.status='ランキングに登録しました！';renderRank();setTimeout(()=>{RANK.status='';renderRank();},3000);}}
    else if(res&&res.err==='wait')setTimeout(()=>submitRank(kind,val),5500);
  }).catch(()=>{RANK.status='ランキングに送れませんでした';renderRank();});
}
document.getElementById('rkSave').addEventListener('click',()=>{

    rankName=nm;try{localStorage.setItem('gogoimo_name',rankName);}catch(e){}

  }).catch(()=>{RANK.status='保存できませんでした（通信エラー）';renderRank();});
});

function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- 背景（ステージ：横浜→東京→埼玉→群馬 太田） ----------
// 背景は 320x180 の座標で描いて 1.5倍する。空気遠近（遠いほど薄く青く）・陰影・窓・街灯で少しリアルに
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function seeded(s){return ()=>{s=(s*16807)%2147483647;return s/2147483647;};}
function tile(off,span,fn){let b=-(off%span);if(b>0)b-=span;for(;b<320;b+=span)fn(b);}
function poly(P,col){ctx.fillStyle=col;ctx.beginPath();P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();}
function sky(stops){const g=ctx.createLinearGradient(0,0,0,140);stops.forEach((c,i)=>g.addColorStop(i/(stops.length-1),c));ctx.fillStyle=g;ctx.fillRect(-4,-4,328,188);}
function sunGlow(x,y,r,core,glow){
  const g=ctx.createRadialGradient(x,y,0,x,y,r*4);g.addColorStop(0,glow);g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(x-r*4,y-r*4,r*8,r*8);ctx.fillStyle=core;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
}
// もこもこした雲（上が明るく下に影）
function cloudLayer(off,span,y,scale,lit,dark,seed){
  const r=seeded(seed),C=[];for(let i=0;i<4;i++)C.push([r()*span,y+r()*16,scale*(0.7+r()*0.6)]);
  tile(off,span,b=>{for(const [x,cy,s] of C){
    const puffs=[[0,0,14],[11,-4,10],[-10,-2,9],[20,1,8],[-18,2,6]];
    ctx.fillStyle=dark;for(const [px,py,pr] of puffs){ctx.beginPath();ctx.ellipse(b+x+px*s,cy+py*s+2*s,pr*s,pr*s*0.55,0,0,7);ctx.fill();}
    ctx.fillStyle=lit;for(const [px,py,pr] of puffs){ctx.beginPath();ctx.ellipse(b+x+px*s,cy+py*s,pr*s*0.95,pr*s*0.5,0,0,7);ctx.fill();}
  }});
}
// 地平線のかすみ
function haze(y0,y1,col){const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,col);ctx.fillStyle=g;ctx.fillRect(-4,y0,328,y1-y0);}
// ビル1棟：右側の影・屋上の設備・窓（明かり／反射）
function bldg(x,base,w,h,col,seed,lit=0.15){
  const r=seeded(seed),top=base-h;
  rect(x,top,w,h,col);
  const sw=Math.max(2,Math.round(w*0.2));rect(x+w-sw,top,sw,h,shade(col,-28));rect(x,top,w,1,shade(col,26));
  const glass=shade(col,-45),refl=shade(col,40);
  for(let wy=top+3;wy<base-2;wy+=4)for(let wx=x+2;wx<x+w-sw-1;wx+=3){
    const q=r();ctx.fillStyle=q<lit?'#ffe7a0':q<lit+0.25?refl:glass;ctx.fillRect(wx,wy,2,2);
  }
  const k=r();
  if(w>12&&k<0.35){rect(x+3,top-3,5,3,shade(col,-20));rect(x+w-9,top-2,4,2,shade(col,-35));}
  else if(k<0.55){rect(x+w/2,top-7,1,7,'#9aa3b0');}
  else if(k<0.7&&w>10){rect(x+2,top-4,6,4,'#c9ccd4');rect(x+3,top-5,4,1,'#9aa3b0');}
}
function skyline(off,span,seed,base,hMin,hMax,cols,lit){
  const r=seeded(seed),B=[];let x=0;
  while(x<span){const w=10+r()*22|0,h=hMin+r()*(hMax-hMin)|0;B.push([x,w,h,cols[(r()*cols.length)|0],(r()*1e6)|0]);x+=w+(r()*3|0);}
  tile(off,span,b=>{for(const [bx,w,h,c,s] of B){const X=Math.round(b+bx);if(X>320||X+w<0)continue;bldg(X,base,w,h,c,s,lit);}});
}
// 木の茂み
function trees(off,span,y,col,seed,dens=1){
  const r=seeded(seed),T=[];for(let x=0;x<span;x+=6+r()*10/dens)T.push([x,4+r()*5]);
  tile(off,span,b=>{for(const [x,s] of T){ctx.fillStyle=shade(col,-25);ctx.beginPath();ctx.arc(b+x+1,y-s+1,s,0,7);ctx.fill();
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(b+x,y-s,s,0,7);ctx.fill();ctx.fillStyle=shade(col,25);ctx.fillRect(b+x-s*0.4,y-s*1.5,s*0.6,1);}});
}
// 送電線の鉄塔（トラス）
function pylon(x,base,h){
  const top=base-h;ctx.strokeStyle='#9aa0ab';ctx.lineWidth=0.8;
  ctx.beginPath();ctx.moveTo(x-6,base);ctx.lineTo(x-1.5,top);ctx.lineTo(x+1.5,top);ctx.lineTo(x+6,base);ctx.stroke();
  for(let i=0;i<5;i++){const y1=base-i*h/5,y2=base-(i+1)*h/5,w1=6-4.5*i/5,w2=6-4.5*(i+1)/5;ctx.beginPath();ctx.moveTo(x-w1,y1);ctx.lineTo(x+w2,y2);ctx.moveTo(x+w1,y1);ctx.lineTo(x-w2,y2);ctx.stroke();}
  rect(x-9,top+6,18,1,'#9aa0ab');rect(x-7,top+13,14,1,'#9aa0ab');
}
function guardrail(off){
  const gr=-((off)%24);

function streetLights(off){

function road(d){

const STAGES=[{name:'横浜',start:0},{name:'東京',start:9000},{name:'埼玉',start:19000},{name:'群馬 太田',start:29000}];
const GOAL=38000, FADE=1400, TOTAL_KM=120;
function stageAt(d){let i=0;for(let k=0;k<STAGES.length;k++)if(d>=STAGES[k].start)i=k;return i;}
function drawBG(dist){
  const d=dist/BG;
  ctx.save();ctx.scale(BG,BG);
  const ret=(G.lap||1)>=2, pos=ret?GOAL-dist:dist;  // 帰り道は太田→横浜の逆順
  const i=stageAt(pos);
  STAGE_DRAW[i](d);
  if(ret){const cur=STAGES[i];if(i>0&&pos<cur.start+FADE){ctx.globalAlpha=(cur.start+FADE-pos)/FADE;STAGE_DRAW[i-1](d);ctx.globalAlpha=1;}}
  else{const nx=STAGES[i+1];if(nx && dist>nx.start-FADE){ctx.globalAlpha=(dist-(nx.start-FADE))/FADE;STAGE_DRAW[i+1](d);ctx.globalAlpha=1;}}
  // 行きのスタート：メロンテニスクラブの住宅街から、走り出すと横浜へ切り替わる
  if(!ret&&G.mode!=='title'&&dist<HOME_END){ctx.globalAlpha=Math.max(0,Math.min(1,(HOME_END-dist)/HOME_FADE));drawHome(d);ctx.globalAlpha=1;}
  if(ret&&G.mode!=='title'&&pos<CITY_START){ctx.globalAlpha=Math.max(0,Math.min(1,(CITY_START-pos)/CITY_FADE));drawEditCity(d);ctx.globalAlpha=1;}
  road(d); // 道路（共通）
  ctx.restore();
}

  if(G.mode==='title'){reset();G.lap=1;startIntro();}

  else if(G.mode==='clear' && G.overT>50){

const SUBARU_RATE=[0.25,0.15,0.35,0.45]; // 横浜・東京（少なめ）・埼玉・太田（埼玉・太田は易しめに調整）
function spawnCar(){
  const LP=(G.lap||1)-1;
  let subaru=Math.random()<SUBARU_RATE[G.stage]+G.time/3600*0.03+LP*0.08;
  // 直前のスバル車とくっつかないように：近ければスバル以外にする
  const last=G.cars.filter(c=>c.state==='run'&&c.subaru).sort((a,b)=>b.x-a.x)[0];
  if(subaru&&last&&W+10-(last.x+last.w)<subGap(last))subaru=false;
  let m,color;
  // BRZは東京から、WRX（STI・22B）は埼玉から登場
  const MIN_STAGE={brz:1,sti:2,'22b':2};
  if(subaru){m=pick(SUBARU_MODELS.filter(x=>LP>0||(MIN_STAGE[x.id]||0)<=G.stage));color=m.color;}else{m=pick(OTHER_MODELS);color=pick(OTHER_COLORS);}
  const spr=getCar(m,color);
  let v=subaru?rnd(1.1,2.0):rnd(0.3,1.7); // 遅すぎるスバル車は1回のジャンプで越えられないので、下限を上げる
  if(m.id==='truck'||m.id==='minivan'||m.id==='sambar'||m.id==='s360') v*=0.55;
  if(m.id==='sports') v+=0.6;
  if(m.id==='brz') v+=1.1;                     // BRZは速い
  if(m.id==='sti'||m.id==='22b') v+=1.7;       // WRXはもっと速い
  if(subaru) v+=LP*1.0;                        // 2周目以降はスバル車がさらに速い
  G.cars.push({x:W+10,m,color,spr,subaru,v,state:'run',t:0,w:m.w+PAD*2,h:m.h+PAD*2});
}
// スバル車どうしの最低の車間：着地してもう一度跳べるだけのすき間（速いほど広く）

function hurt(p,msg){
  if(p.inv>0) return;
  if((G.lap||1)>=2){ // 帰り道：ライフは減らないが倒れてストップ
    p.down=80;p.inv=150;p.kb=true;p.vx=-3.2;p.vy=Math.min(p.vy,-5);p.on=false;G.combo=0;G.shake=8;snd('hurt');if(msg)addText(p.x+23,p.y-6,msg,'#ff6b6b');
    if(Math.random()<0.5)G.say={s:'ｳﾜｰ!!!',t:0};return;
  }
  G.hp--;p.inv=90;p.hurtT=24;G.combo=0;G.shake=10;snd('hurt');
  if(msg) addText(p.x+23,p.y-6,msg,'#ff6b6b');
  if(G.hp<=0){ // ライフゼロ：後ろへはじき飛ばされて倒れてから、ゲームオーバー表示
    p.dying=true;p.dyingT=0;p.down=9999;p.inv=120;p.kb=true;p.vx=-3.2;p.vy=Math.min(p.vy,-5);p.on=false;p.hurtT=0;bgmStop();

function surface(c,x0,x1){
  const a=Math.max(Math.ceil(x0),Math.ceil(c.x)),b=Math.min(Math.floor(x1),Math.floor(c.x+c.w-1));
  if(a>b) return null;
  let s=Infinity;const y0=GROUND-c.h+PAD+Math.round(c.ly||0);
  for(let x=a;x<=b;x++){const t=c.spr.top[x-Math.floor(c.x)];if(t!==undefined&&t<Infinity)s=Math.min(s,y0+t);}
  return s===Infinity?null:s;
}

function update(){
  G.time++;

  if(--G.waterT<=0){G.items.push({x:W+10,y:rnd(110,165),t:0,kind:'water'});G.waterT=(G.lap||1)>=2?(G.water<50?rnd(420,620):rnd(800,1200)):(G.water<50?rnd(280,420):rnd(520,760));} // 行きは多め
  if(!G.p.mecha && --G.mechaT<=0){G.items.push({x:W+10,y:rnd(95,140),t:0,kind:'mecha'});G.mechaT=rnd(1800,2700);}
  if(p.mecha>0){p.mecha--;if(p.mecha===0){addText(p.x+23,p.y-8,'ザクいもっち終了','#cfe0ff');snd('mechaEnd');}}
  if(G.dist>=GOAL-W && !G.gate) G.gate={x:W+20};

  for(const c of G.cars){

    if(c.state==='fly'){c.x+=c.vx-G.speed*0.3;c.fy+=c.vy;c.vy+=0.32;c.rot+=c.vr;continue;}

  }
  const run=G.cars.filter(c=>c.state==='run').sort((a,b)=>a.x-b.x);
  // 追い越し：前の車に追いついたら、奥の車線が空いていれば移って抜く。抜いたら手前に戻る
  const laneFree=(lane,c,mg)=>!run.some(d=>d!==c&&d.lane===lane&&d.x<c.x+c.w+mg&&d.x+d.w>c.x-mg);
  for(const c of run){

    const ahead=run.filter(d=>d!==c&&d.lane===c.lane&&d.x<c.x).sort((a,b)=>b.x-a.x)[0];
    if(ahead&&c.x<ahead.x+ahead.w+30){
      if(c.lane===0&&c.v>ahead.v+0.1&&laneFree(1,c,20)){c.lane=1;}
      else if(c.x<ahead.x+ahead.w+12){c.x=ahead.x+ahead.w+12;c.v=Math.min(c.v,ahead.v);}
    }
    // スバル車はスバル車を抜かない：前のスバル車（どの車線でも）と車間をあけてついていく
    if(c.subaru){
      const sa=run.filter(d=>d!==c&&d.subaru&&d.x<c.x).sort((a,b)=>b.x-a.x)[0];
      const gap=sa?subGap(sa):0;
      if(sa&&c.x<sa.x+sa.w+gap+30){c.v=Math.min(c.v,sa.v);if(c.lane===1&&laneFree(0,c,24))c.lane=0;}
      if(sa&&c.x<sa.x+sa.w+gap)c.x=sa.x+sa.w+gap;
    }
    if(c.lane===1&&laneFree(0,c,24))c.lane=0;
    const ty=c.lane?-10:0;c.ly=(c.ly||0)+Math.sign(ty-(c.ly||0))*Math.min(1,Math.abs(ty-(c.ly||0)));
  }

  }
  G.cones=G.cones.filter(k=>k.x>-30&&(k.y||0)<120);

  const fx0=p.x+15,fx1=p.x+29, bx0=p.x+12,bx1=p.x+33;

        G.say={s:pick(['やっぱりスバルがナンバー1！','スバルは宇宙イチ！','ｵﾘｬｰ!!','どいてどいてー！']),t:0};

      }

        if(G.hp<5&&(G.lap||1)<2){G.hp=5;addText(it.x+14,iy-6,'HP全回復！','#7dff8a');}else{G.score+=1500;addText(it.x+14,iy-6,'+1500','#7dff8a');}

// ---------- 描画 ----------
function txt(s,x,y,size,col,align='left'){
  ctx.font=`bold ${size}px "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif`;
  ctx.textAlign=align;ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(2.5,size/3.5);ctx.strokeStyle='#16121e';ctx.lineJoin='round';ctx.strokeText(s,x,y);
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function heart(x,y,full){
  const rows=[".KK.KK.","KRRKRRK","KRRRRRK",".KRRRK.","..KRK..","...K..."];
  rows.forEach((r,j)=>{for(let i=0;i<7;i++){const ch=r[i];if(ch==='.')continue;
    ctx.fillStyle=ch==='K'?'#16121e':(full?'#ff4a5a':'#4a3b55');ctx.fillRect(x+i*2,y+j*2,2,2);}});
}
function star(cx,cy,col){
  const P=[[0,-3],[1,-1],[3,-1],[1,1],[2,3],[0,2],[-2,3],[-1,1],[-3,-1],[-1,-1]];
  ctx.beginPath();P.forEach((p,i)=>{const X=cx+p[0]*2,Y=cy+p[1]*2;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});ctx.closePath();
  ctx.fillStyle=col;ctx.fill();ctx.strokeStyle='#16121e';ctx.lineWidth=1.2;ctx.stroke();
}
function drawCar(c,label=true){
  const X=Math.round(c.x),Y=GROUND-c.h+PAD+Math.round(c.ly||0);
  const fr=c.spr.fr[((c.t*(G.speed+c.v)*0.12)|0)%4];
  if(c.state==='squash'){ctx.drawImage(fr,X,GROUND+PAD-Math.round(c.h*0.35),c.w,Math.round(c.h*0.35));return;}
  if(c.state==='fly'){ctx.save();ctx.translate(X+c.w/2,Y+c.h/2+c.fy);ctx.rotate(c.rot*Math.PI);ctx.drawImage(fr,-c.w/2,-c.h/2,c.w,c.h);ctx.restore();return;}
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(X+2,GROUND-1,c.w-4,3);ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(X+8,GROUND-2,c.w-16,2);
  const bob=((c.t/6)|0)%2;
  ctx.drawImage(fr,X,Y-bob,c.w,c.h);
  if(c.subaru&&label){
    const top=Y+Math.min(...c.spr.top.filter(isFinite))-14+(((c.t/8)|0)%2);
    star(X+c.w/2-((c.m.name.length*3.2)|0)-4,top,'#ffe14d');
    txt(c.m.name,X+c.w/2+4,top,10,'#cfe0ff','center');
  }
}
function drawPlayer(p){
  let spr;

  else if(!p.on)spr=CHAR.jump;
  else if(G.mode==='intro'){const h=G.hopAt||8;spr=G.introT>h&&G.introT<h+18?CHAR.jump:CHAR.idle;}
  else spr=CHAR.run[((p.anim/5)|0)%8];

    ctx.save();ctx.translate(Math.round(p.x)+CW/2,Math.round(p.y)+FOOT/2);ctx.rotate(-(G.time%60)/60*Math.PI*2*1.5);ctx.drawImage(CHAR.hurt,-CW/2,-FOOT/2);ctx.restore();
    return;
  }
  if(p.down>0){ // バタッと倒れている

    for(let i=0;i<3;i++){const a=G.time/8+i*2.1;txt('★',X+CW/2-f*16+Math.cos(a)*10,GROUND-30+Math.sin(a)*4,9,'#ffe14d','center');}
    return;
  }
  const blink=p.inv>0&&((p.inv/4|0)%2)&&G.mode==='play';
  if(blink)return;

  const X=Math.round(p.x),Y=Math.round(p.y);

  if(!p.on&&p.jumps===2&&p.vy<0){ctx.translate(X+CW/2,Y+FOOT/2);ctx.rotate((p.vy+7.8)/7.8*Math.PI*2*(p.face?-1:1));ctx.translate(-CW/2,-FOOT/2);}
  else ctx.translate(X,Y);

  if(p.mecha>0){

// 帰り道の時計：0時に太田を出発。ゲームの1秒＝2分なので、3分（DAWN）で朝6時になる
function drawClock(x,y,r,f){
  const min=f/30,late=f>DAWN;                       // 0時からの経過（分）
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.arc(x+1,y+1.5,r+2,0,7);ctx.fill();
  ctx.fillStyle=late?'#ffe6c8':'#1d2550';ctx.beginPath();ctx.arc(x,y,r+2,0,7);ctx.fill();          // 縁
  ctx.fillStyle=late?'#fff6e6':'#f4f1e6';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();             // 文字盤
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2,l=i%3?1.6:3;ctx.strokeStyle=i%3?'#8a8fa8':'#2a2f48';ctx.lineWidth=i%3?0.8:1.4;
    ctx.beginPath();ctx.moveTo(x+Math.sin(a)*(r-1),y-Math.cos(a)*(r-1));ctx.lineTo(x+Math.sin(a)*(r-1-l),y-Math.cos(a)*(r-1-l));ctx.stroke();}
  ctx.fillStyle='#2a2f48';ctx.font='bold 5px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('12',x,y-r+6);ctx.fillText('6',x,y+r-6);ctx.fillText('3',x+r-5,y);ctx.fillText('9',x-r+5,y);
  const ha=(min/60)/12*Math.PI*2,ma=(min%60)/60*Math.PI*2;ctx.lineCap='round';
  ctx.strokeStyle='#22263a';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.sin(ha)*r*0.5,y-Math.cos(ha)*r*0.5);ctx.stroke();   // 短針
  ctx.strokeStyle=late?'#e8483b':'#3a4a8a';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.sin(ma)*r*0.8,y-Math.cos(ma)*r*0.8);ctx.stroke(); // 長針
  ctx.fillStyle='#e8483b';ctx.beginPath();ctx.arc(x,y,1.4,0,7);ctx.fill();
  ctx.restore();
  const h=Math.floor(min/60),m=Math.floor(min%60);
  txt(`${h<12?'午前':'午後'}${h%12}:${String(m).padStart(2,'0')}`,x+r+6,y-4,11,late?'#ff9a9a':'#ffffff');
  txt(late?'夜が明けた！':h>=5?'もうすぐ夜明け':'夜明けは6時',x+r+6,y+8,8,late?'#ffb36b':'#cfe0ff');
}

const LFONT=(s,w=900)=>`${w} ${s}px "Hiragino Kaku Gothic StdN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo UI",Meiryo,sans-serif`;
function lgCanvas(){const c=document.createElement('canvas');c.width=880;c.height=260;return c;}
function lgRound(o,x,y,w,h,r){o.beginPath();o.moveTo(x+r,y);o.arcTo(x+w,y,x+w,y+h,r);o.arcTo(x+w,y+h,x,y+h,r);o.arcTo(x,y+h,x,y,r);o.arcTo(x,y,x+w,y,r);o.closePath();}
// 立体の文字：奥へ伸びる側面→太い縁→表面のグラデーション→ハイライト
function lgExtrude(o,s,x,y,size,face1,face2,side,depth,out='#16121e',align='left'){
  o.font=LFONT(size);o.textAlign=align;o.textBaseline='alphabetic';o.lineJoin='round';
  for(let i=depth;i>=0;i--){o.lineWidth=14;o.strokeStyle=out;o.strokeText(s,x+i,y+i);}
  for(let i=depth;i>=1;i--){o.fillStyle=side;o.fillText(s,x+i,y+i);}
  const gr=o.createLinearGradient(0,y-size*0.85,0,y);gr.addColorStop(0,face1);gr.addColorStop(1,face2);
  o.fillStyle=gr;o.fillText(s,x,y);
  o.save();o.beginPath();o.rect(0,y-size,880,size*0.42);o.clip();o.fillStyle='rgba(255,255,255,.35)';o.fillText(s,x,y);o.restore();
  return o.measureText(s).width;
}
function lgSparkle(o,x,y,r,col='#fffbe0'){o.fillStyle=col;o.beginPath();o.moveTo(x,y-r);o.quadraticCurveTo(x,y,x+r,y);o.quadraticCurveTo(x,y,x,y+r);o.quadraticCurveTo(x,y,x-r,y);o.quadraticCurveTo(x,y,x,y-r);o.fill();}
function lgSprite(o,img,x,y,s){o.save();o.imageSmoothingEnabled=false;o.drawImage(img,x,y,img.width*s,img.height*s);o.restore();}
function lgCar(o,x,yBottom,s){const car=getCar(OTHER_MODELS[0],'#d8312b').fr[0];const w=car.width/CS*s,h=car.height/CS*s;o.save();o.imageSmoothingEnabled=false;o.drawImage(car,x,yBottom-h,w,h);o.restore();return w;}

// D：ドット絵（小さく描いた文字をドットのまま拡大し、縁取りと段々のグラデーション）
function lgPixelWord(s,size,cols,outline,shadow){
  const tw=Math.ceil(size*s.length*1.05)+8,th=Math.ceil(size*1.25)+6;
  const t=document.createElement('canvas');t.width=tw;t.height=th;const g=t.getContext('2d');
  g.font=LFONT(size);g.textBaseline='alphabetic';g.fillStyle='#000';g.fillText(s,3,size+2);
  const d=g.getImageData(0,0,tw,th).data,on=(x,y)=>x>=0&&y>=0&&x<tw&&y<th&&d[(y*tw+x)*4+3]>110;
  let minY=th,maxY=0,maxX=0;for(let y=0;y<th;y++)for(let x=0;x<tw;x++)if(on(x,y)){minY=Math.min(minY,y);maxY=Math.max(maxY,y);maxX=Math.max(maxX,x);}
  const out=document.createElement('canvas');out.width=maxX+6;out.height=maxY-minY+7;const p=out.getContext('2d');
  const put=(x,y,col)=>{p.fillStyle=col;p.fillRect(x,y,1,1);};
  for(let y=minY-2;y<=maxY+3;y++)for(let x=0;x<=maxX+4;x++){
    const X=x+1,Y=y-minY+2;
    if(on(x,y)){const k=(y-minY)/(maxY-minY+1);put(X,Y,cols[Math.min(cols.length-1,Math.floor(k*cols.length))]);if(!on(x,y-1))put(X,Y,'#ffffff');}
    else if(on(x-1,y-1)&&!on(x-1,y)&&!on(x,y-1))put(X,Y,shadow);
    else if(on(x-1,y)||on(x+1,y)||on(x,y-1)||on(x,y+1))put(X,Y,outline);
    else if(on(x-1,y-1)||on(x-2,y-2))put(X,Y,shadow);
  }
  return out;
}

let last=performance.now(),accum=0;
function loop(now){
  accum+=Math.min(100,now-last);last=now;
  // 1回エラーが出てもゲームが止まらないようにする（無敵時間などの値も正常な範囲に戻す）
  while(accum>=1000/60){
    try{if(!G.paused)update();}catch(e){console.error(e);if(G.p){G.p.inv=Math.min(G.p.inv||0,90);}if(!(G.spawnT>0&&G.spawnT<9999))G.spawnT=60;}
    accum-=1000/60;
  }
  try{draw();}catch(e){console.error(e);}
  requestAnimationFrame(loop);
}
